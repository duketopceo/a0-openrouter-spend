<html>
<head>
  <title>OpenRouter Usage</title>
  <script type="module" src="/plugins/openrouter_usage/webui/usage-store.js"></script>
</head>
<body>
  <div x-data>
    <template x-if="$store.openrouterUsageStore">
      <div x-init="$store.openrouterUsageStore.onOpen()" x-destroy="$store.openrouterUsageStore.cleanup()">

        <div class="or-header">
          <div>
            <div class="section-title">OpenRouter Usage</div>
            <div class="or-subline" x-text="$store.openrouterUsageStore.asOfLabel ? `Updated ${$store.openrouterUsageStore.asOfLabel}` : ''"></div>
          </div>
          <div class="or-toggle">
            <button type="button" class="btn" :class="{ active: $store.openrouterUsageStore.view === 'simple' }" @click="$store.openrouterUsageStore.setView('simple')">Simple</button>
            <button type="button" class="btn" :class="{ active: $store.openrouterUsageStore.view === 'detailed' }" @click="$store.openrouterUsageStore.setView('detailed')">Detailed</button>
          </div>
        </div>

        <template x-if="$store.openrouterUsageStore.emptyState === 'missing_management_key'">
          <div class="or-empty">Add <code>OPENROUTER_MANAGEMENT_KEY</code> to Agent Zero Secrets, then refresh.</div>
        </template>

        <template x-if="$store.openrouterUsageStore.hasData">
          <!-- Summary cards -->
          <div class="or-grid">
            <div class="or-card or-card-primary">
              <div class="or-card-label">30-day spend</div>
              <div class="or-card-value" x-text="$store.openrouterUsageStore.totals?.usd_label || '$0'"></div>
              <div class="or-card-sub" x-text="`${$store.openrouterUsageStore.formatNumber($store.openrouterUsageStore.totals?.requests || 0)} requests`"></div>
            </div>
            <div class="or-card">
              <div class="or-card-label">Month-to-date</div>
              <div class="or-card-value" x-text="$store.openrouterUsageStore.summary?.mtd_label || '$0'"></div>
              <div class="or-card-sub" x-text="`${$store.openrouterUsageStore.pctOf($store.openrouterUsageStore.summary?.mtd, $store.openrouterUsageStore.credits?.total_usage)} of lifetime`"></div>
            </div>
            <div class="or-card">
              <div class="or-card-label">Lifetime spend</div>
              <div class="or-card-value" x-text="$store.openrouterUsageStore.credits?.usage_label || '—'"></div>
              <div class="or-card-sub" x-text="`Balance ${$store.openrouterUsageStore.credits?.balance_label || '—'}`"></div>
            </div>
            <div class="or-card">
              <div class="or-card-label">Daily average</div>
              <div class="or-card-value" x-text="$store.openrouterUsageStore.summary?.avg_daily_label || '$0'"></div>
              <div class="or-card-sub" x-text="`${$store.openrouterUsageStore.summary?.projected_monthly_label || '$0'} projected 30d`"></div>
            </div>
          </div>

          <!-- SIMPLE VIEW -->
          <template x-if="$store.openrouterUsageStore.view === 'simple'">
            <div class="or-simple">
              <section class="or-section">
                <h3>Top models</h3>
                <div class="or-bars">
                  <template x-for="(row, i) in ($store.openrouterUsageStore.topModels || [])" :key="row.model">
                    <div class="or-bar-row">
                      <span class="or-bar-label" x-text="row.model"></span>
                      <div class="or-bar-track">
                        <div class="or-bar-fill" :style="{ width: $store.openrouterUsageStore.barWidth(row.usd, $store.openrouterUsageStore.maxBar($store.openrouterUsageStore.allModels)), background: $store.openrouterUsageStore.colorFor(i) }"></div>
                      </div>
                      <span class="or-bar-value" x-text="$store.openrouterUsageStore.formatUsd(row.usd)"></span>
                    </div>
                  </template>
                </div>
              </section>

              <div class="or-split">
                <section class="or-section">
                  <h3>Top keys</h3>
                  <div class="or-bars">
                    <template x-for="(row, i) in ($store.openrouterUsageStore.topKeys || [])" :key="row.label">
                      <div class="or-bar-row">
                        <span class="or-bar-label" x-text="row.label"></span>
                        <div class="or-bar-track">
                          <div class="or-bar-fill" :style="{ width: $store.openrouterUsageStore.barWidth(row.usd, $store.openrouterUsageStore.maxBar($store.openrouterUsageStore.perKey)), background: $store.openrouterUsageStore.colorFor(i) }"></div>
                        </div>
                        <span class="or-bar-value" x-text="$store.openrouterUsageStore.formatUsd(row.usd)"></span>
                      </div>
                    </template>
                  </div>
                </section>

                <section class="or-section">
                  <h3>Top providers</h3>
                  <div class="or-bars">
                    <template x-for="(row, i) in ($store.openrouterUsageStore.topProviders || [])" :key="row.provider">
                      <div class="or-bar-row">
                        <span class="or-bar-label" x-text="row.provider"></span>
                        <div class="or-bar-track">
                          <div class="or-bar-fill" :style="{ width: $store.openrouterUsageStore.barWidth(row.usd, $store.openrouterUsageStore.maxBar($store.openrouterUsageStore.allProviders)), background: $store.openrouterUsageStore.colorFor(i) }"></div>
                        </div>
                        <span class="or-bar-value" x-text="$store.openrouterUsageStore.formatUsd(row.usd)"></span>
                      </div>
                    </template>
                  </div>
                </section>
              </div>

              <section class="or-section">
                <h3>30-day trend</h3>
                <div class="or-daily-bars">
                  <template x-for="day in ($store.openrouterUsageStore.daily || [])" :key="day.date">
                    <div class="or-daily-row">
                      <span class="or-daily-label" x-text="day.label"></span>
                      <div class="or-daily-track">
                        <div class="or-daily-fill" :style="{ width: $store.openrouterUsageStore.barWidth(day.total, $store.openrouterUsageStore.maxBar($store.openrouterUsageStore.daily, 'total')) }"></div>
                      </div>
                      <span class="or-daily-value" x-text="$store.openrouterUsageStore.formatUsd(day.total)"></span>
                    </div>
                  </template>
                </div>
              </section>
            </div>
          </template>

          <!-- DETAILED VIEW -->
          <template x-if="$store.openrouterUsageStore.view === 'detailed'">
            <div class="or-detailed">
              <section class="or-section">
                <h3>Daily spend by key</h3>
                <div class="or-legend">
                  <template x-for="(color, label) in $store.openrouterUsageStore.allKeyColors" :key="label">
                    <span class="or-legend-item"><span class="or-dot" :style="{ background: color }"></span><span x-text="label"></span></span>
                  </template>
                </div>
                <div class="or-daily-bars">
                  <template x-for="day in ($store.openrouterUsageStore.daily || [])" :key="day.date">
                    <div class="or-daily-row">
                      <span class="or-daily-label" x-text="day.label"></span>
                      <div class="or-daily-track">
                        <template x-for="seg in $store.openrouterUsageStore.stackedSegments(day, $store.openrouterUsageStore.allKeyColors)" :key="seg.label">
                          <div class="or-daily-segment" :style="{ width: seg.pct + '%', left: seg.left + '%', background: seg.color }" :title="`${seg.label}: ${$store.openrouterUsageStore.formatUsd(seg.value)} of ${$store.openrouterUsageStore.formatUsd(seg.total)}`"></div>
                        </template>
                      </div>
                      <span class="or-daily-value" x-text="$store.openrouterUsageStore.formatUsd(day.total)"></span>
                    </div>
                  </template>
                </div>
              </section>

              <section class="or-section">
                <h3>Spend by key</h3>
                <div class="or-table-wrap">
                  <table class="or-table">
                    <thead>
                      <tr>
                        <th>Key</th>
                        <th>USD</th>
                        <th x-show="$store.openrouterUsageStore.showTokenCounts">Prompt</th>
                        <th x-show="$store.openrouterUsageStore.showTokenCounts">Completion</th>
                        <th x-show="$store.openrouterUsageStore.showTokenCounts">Reasoning</th>
                        <th>Requests</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="row in ($store.openrouterUsageStore.perKey || [])" :key="row.label">
                        <tr>
                          <td x-text="row.label"></td>
                          <td x-text="$store.openrouterUsageStore.formatUsd(row.usd)"></td>
                          <td x-show="$store.openrouterUsageStore.showTokenCounts" x-text="$store.openrouterUsageStore.formatNumber(row.prompt_tokens)"></td>
                          <td x-show="$store.openrouterUsageStore.showTokenCounts" x-text="$store.openrouterUsageStore.formatNumber(row.completion_tokens)"></td>
                          <td x-show="$store.openrouterUsageStore.showTokenCounts" x-text="$store.openrouterUsageStore.formatNumber(row.reasoning_tokens)"></td>
                          <td x-text="$store.openrouterUsageStore.formatNumber(row.requests)"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </section>

              <div class="or-split">
                <section class="or-section">
                  <h3>By model</h3>
                  <div class="or-table-wrap">
                    <table class="or-table">
                      <thead>
                        <tr><th>Model</th><th>Spend</th><th>% of 30d</th></tr>
                      </thead>
                      <tbody>
                        <template x-for="row in ($store.openrouterUsageStore.allModels || [])" :key="row.model">
                          <tr>
                            <td x-text="row.model"></td>
                            <td x-text="$store.openrouterUsageStore.formatUsd(row.usd)"></td>
                            <td x-text="$store.openrouterUsageStore.pctOf(row.usd, $store.openrouterUsageStore.totals?.usd)"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </section>

                <section class="or-section">
                  <h3>By provider</h3>
                  <div class="or-bars">
                    <template x-for="(row, i) in ($store.openrouterUsageStore.allProviders || [])" :key="row.provider">
                      <div class="or-bar-row">
                        <span class="or-bar-label" x-text="row.provider"></span>
                        <div class="or-bar-track">
                          <div class="or-bar-fill" :style="{ width: $store.openrouterUsageStore.barWidth(row.usd, $store.openrouterUsageStore.maxBar($store.openrouterUsageStore.allProviders)), background: $store.openrouterUsageStore.colorFor(i) }"></div>
                        </div>
                        <span class="or-bar-value" x-text="$store.openrouterUsageStore.formatUsd(row.usd)"></span>
                      </div>
                    </template>
                  </div>
                </section>
              </div>
            </div>
          </template>

          <template x-if="$store.openrouterUsageStore.overview?.last_error">
            <div class="or-warn" x-text="$store.openrouterUsageStore.overview.last_error"></div>
          </template>
        </template>
      </div>
    </template>
  </div>

  <style>
    .or-header { display: flex; justify-content: space-between; gap: 12px; align-items: start; flex-wrap: wrap; margin-bottom: 16px; }
    .or-toggle { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn.active { outline: 2px solid var(--color-primary, #6cf); }
    .or-subline { opacity: 0.75; font-size: 0.8rem; }

    .or-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); margin: 16px 0; }
    .or-card { border: 1px solid var(--color-border, #333); border-radius: 12px; padding: 14px; background: color-mix(in srgb, var(--color-bg, #131313) 96%, var(--color-primary, #6cf)); }
    .or-card-primary { background: color-mix(in srgb, var(--color-bg, #131313) 90%, var(--color-primary, #6cf)); border-color: color-mix(in srgb, var(--color-primary, #6cf) 50%, var(--color-border, #333)); }
    .or-card-label { opacity: 0.7; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .or-card-value { font-size: clamp(1.3rem, 4vw, 1.7rem); font-weight: 700; margin: 6px 0 4px; word-break: break-word; }
    .or-card-sub { opacity: 0.75; font-size: 0.78rem; }

    .or-section { margin-top: 22px; }
    .or-section h3 { font-size: 0.95rem; font-weight: 700; margin: 0 0 12px; opacity: 0.9; }

    .or-split { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }

    .or-bars { display: grid; gap: 10px; }
    .or-bar-row { display: grid; grid-template-columns: minmax(100px, 140px) 1fr auto; gap: 10px; align-items: center; }
    .or-bar-label { font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .or-bar-track { height: 12px; min-width: 0; background: color-mix(in srgb, var(--color-border) 40%, transparent); border-radius: 999px; overflow: hidden; }
    .or-bar-fill { height: 100%; opacity: 0.9; min-width: 2px; border-radius: 999px; transition: width 0.35s ease; }
    .or-bar-value { font-size: 0.78rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

    .or-daily-bars { display: grid; gap: 10px; }
    .or-daily-row { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; }
    .or-daily-label { font-size: 0.75rem; opacity: 0.85; text-align: right; }
    .or-daily-track { height: 16px; min-width: 0; background: color-mix(in srgb, var(--color-border) 40%, transparent); border-radius: 999px; overflow: hidden; position: relative; }
    .or-daily-fill { height: 100%; background: var(--color-primary, #6cf); opacity: 0.85; min-width: 2px; border-radius: 999px; transition: width 0.35s ease; }
    .or-daily-segment { height: 100%; position: absolute; top: 0; min-width: 2px; border-radius: 2px; transition: width 0.35s ease, left 0.35s ease; }
    .or-daily-value { font-size: 0.78rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

    .or-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }
    .or-table { width: 100%; min-width: 480px; border-collapse: collapse; font-size: 0.82rem; }
    .or-table th, .or-table td { border-bottom: 1px solid var(--color-border, #333); padding: 8px 6px; text-align: left; }
    .or-table th { opacity: 0.75; font-weight: 600; }
    .or-table tr:hover td { background: color-mix(in srgb, var(--color-border) 15%, transparent); }

    .or-empty, .or-warn { margin-top: 12px; padding: 12px; border-radius: 10px; background: color-mix(in srgb, var(--color-border) 25%, transparent); font-size: 0.9rem; }
    .or-warn { border-left: 3px solid var(--color-warning, #f7b267); }

    .or-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; font-size: 0.74rem; }
    .or-legend-item { display: inline-flex; align-items: center; gap: 4px; }
    .or-dot { width: 10px; height: 10px; border-radius: 999px; }

    @media (max-width: 720px) {
      .or-header { flex-direction: column; align-items: stretch; }
      .or-toggle { width: 100%; }
      .or-toggle .btn { flex: 1; min-height: 44px; }
      .or-bar-row { grid-template-columns: 1fr auto; gap: 4px; }
      .or-bar-track { grid-column: 1 / -1; }
      .or-bar-label { white-space: normal; }
      .or-daily-row { grid-template-columns: 40px 1fr auto; }
    }
  </style>
</body>
</html>
