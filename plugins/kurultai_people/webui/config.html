<html>
<head>
  <title>Kurultai Memory</title>
  <link rel="stylesheet" href="/plugins/kurultai_people/webui/ui-kit.css" />
  <script type="module" src="/plugins/kurultai_people/webui/kurultai-store.js"></script>
</head>
<body>
  <div x-data>
    <div class="ui-hero">
      <img src="/plugins/kurultai_people/docs/logo.webp" alt="" />
      <div class="ui-hero-titles">
        <div class="ui-hero-title">Kurultai Memory</div>
        <div class="ui-hero-sub">Connect Agent Zero to your Kurultai brain — search, recall, and cite indexed knowledge.</div>
      </div>
      <div class="ui-hero-side">
        <span class="ui-pill" :class="$store.kurultaiPeopleStore?.connectionPill.cls">
          <span class="ui-dot" :class="$store.kurultaiPeopleStore?.connectionPill.cls"></span>
          <span x-text="$store.kurultaiPeopleStore?.connectionPill.label"></span>
        </span>
      </div>
    </div>

    <div class="ui-banner">
      <span>🔑</span>
      <span>Optional bearer token: add <code>KURULTAI_API_KEY</code> in Agent Zero Secrets — never in this file.</span>
    </div>

    <div class="ui-card" style="margin-top:12px">
      <h3>Connection</h3>
      <div class="ui-grid2">
        <label class="ui-field">
          <span class="f-title">Base URL</span>
          <input x-model="config.kurultai_base_url" placeholder="http://127.0.0.1:8421" />
        </label>
        <label class="ui-field">
          <span class="f-title">MCP URL <span class="f-desc" style="display:inline">(optional)</span></span>
          <input x-model="config.kurultai_mcp_url" placeholder="http://127.0.0.1:8421/mcp" />
        </label>
        <label class="ui-field">
          <span class="f-title">Project namespace</span>
          <input x-model="config.kurultai_project" placeholder="default (or KURULTAI_PROJECT)" />
        </label>
        <label class="ui-field">
          <span class="f-title">Timeout (seconds)</span>
          <input type="number" min="3" x-model.number="config.timeout_seconds" />
        </label>
      </div>
      <div class="ui-actions">
        <button type="button" class="ui-btn primary" @click="$store.kurultaiPeopleStore.testConnection()" :disabled="$store.kurultaiPeopleStore?.testing">
          <span x-text="$store.kurultaiPeopleStore?.testing ? 'Testing…' : 'Test connection'"></span>
        </button>
        <span class="f-desc" x-text="$store.kurultaiPeopleStore?.connectionNote" style="align-self:center"></span>
      </div>
    </div>

    <div class="ui-card" style="margin-top:12px">
      <h3>Search defaults</h3>
      <div class="ui-grid2">
        <label class="ui-field">
          <span class="f-title">Max results</span>
          <input type="number" min="1" max="50" x-model.number="config.max_results" />
        </label>
        <label class="ui-field">
          <span class="f-title">Snippet length</span>
          <input type="number" min="80" max="2000" x-model.number="config.snippet_max_chars" />
        </label>
        <label class="ui-field">
          <span class="f-title">Test query</span>
          <input x-model="config.test_query" />
        </label>
        <label class="ui-field inline">
          <input type="checkbox" x-model="config.prefer_recall_for_memory" />
          <span class="f-title">Prefer project recall for memory-style queries</span>
        </label>
      </div>
    </div>
  </div>
</body>
</html>
